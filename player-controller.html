<!DOCTYPE html>

<html lang="eng">
    <head>
        <meta charset="UTF-8">
        <title>Players' Screen - DM Vision</title>

        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                user-select: none;
            }

            body {
                width: 100vw;
                height: 100vh;
                background: #14141e;
                color: #e0e0e0;
                font-family: 'Palatino Linotype', Palatino, Georgia, serif;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }

            /*------------------------------TOOLS BAR--------------------------------------*/
            .toolbar {
                height: 48px;
                background: #1c1c28;
                border-bottom: 1px solid #333348;
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 16px;
                z-index: 100;
            }

            .toolbar-title {
                font-size: 14px;
                font-weight: 700;
                color: #dfb15b;
                display: flex;
                align-items: center;
                gap: 8px;
            }

            .toolbar-actions {
                display: flex;
                align-items: center;
                gap: 8px;
            }

            button {
                background: #2b2b3d;
                color: #e0e0e0;
                border: 1px solid #44445c;
                padding: 6px 12px;
                border-radius: 5px;
                cursor: pointer;
                font-size: 12px;
                font-family: inherit;
                font-weight: 600;
                transition: all 0.2s;
            }

            button:hover {
                background: #3e3e57;
                color: #fff;
                border-color: #dfb15b;
            }

            button:active {
                transform: scale(0.97);
            }

            .btn-initiative {
                background: linear-gradient(135deg, #3a2b10 0%, #291e0a 100%);
                border-color: #dfb15b;
                color: #ffd97d;
            }

            .btn-share {
                background: linear-gradient(135deg, #1f4037 0%, #17332c 100%);
                border-color: #2e8b57;
                color: #a8f0c0;
            }

            .btn-share:hover {
                background: linear-gradient(135deg, #285449 0%, #1e4239 100%);
                color: #fff;
            }

            .btn-share.active {
                background: #8b0000;
                border-color: #ff4d4d;
                color: #fff;
            }

            .btn-blackout {
                background: #201a24;
                border-color: #553355;
            }

            .btn-blackout.active {
                background: #6a1a6a;
                border-color: #ba55d3;
                color: #fff;
            }

            .btn-danger {
                background: #5a1e24;
                border-color: #802830;
            }

            .btn-danger:hover {
                background: #7a2830;
                border-color: #ff5555;
            }

            /*--------------------------REPLAYED PLAYERS' SCREEN---------------------------------*/
            .stage-area {
                flex: 1;
                padding: 20px;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #09090e;
                position: relative;
            }

            .viewport-box {
                width: 100%;
                height: 100%;
                max-width: 960px;
                max-height: 540px;
                background: #000;
                border: 2px solid #dfb15b;
                border-radius: 6px;
                box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
                position: relative;
                overflow: hidden;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .viewport-default {
                position: absolute;
                inset: 0;
                background: radial-gradient(circle at center, #262136 0%, #0d0a17 100%);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 10px;
                color: #dfb15b;
                font-size: 20px;
                letter-spacing: 2px;
                text-transform: uppercase;
                opacity: 0.8;
                z-index: 1;
            }

            .viewport-bg {
                position: absolute;
                inset: 0;
                background: radial-gradient(circle to center, #262136 0%, #0d0a17 100%);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 8px;
                color: #dfb15b;
                font-size: 18px;
                letter-spacing: 2px;
                text-transform: uppercase;
            }

            .viewport-fg {
                position: relative;
                z-index: 10;
                max-width: 90%;
                max-height: 88%;
                object-fit: contain;
                border-radius: 4px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
                display: none;
                transition: transform 0.08s ease-out;
                cursor: grab;
            }

            .viewport-fg:active {
                cursor: grabbing;
            }

            .viewport-video {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                object-fit: contain;
                background: #000;
                display: none;
                z-index: 20;
            }

            /*overlay blackout*/
            .viewport-blackout {
                position: absolute;
                inset: 0;
                background: #000;
                display: none;
                z-index: 50;
                align-items: center;
                justify-content: center;
                color: #555566;
                font: 16px;
                letter-spacing: 2px;
            }

            /*suggestion for drag and drop*/
            .drop-hint {
                position: absolute;
                bottom: 10px;
                left: 50%;
                transform: translateX(-50%);
                background: rgba(0, 0, 0, 0.7);
                color: #dfb15b;
                padding: 4px 12px;
                border-radius: 12px;
                font-size: 11px;
                border: 1px solid rgba(223, 177, 91, 0.4);
                z-index: 30;
                pointer-events: none;
            }

            /*------------------------------ MODAL SHARING WINDOW-------------------------------------*/
            .modal-overlay {
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.75);
                display: none;
                align-items: center;
                justify-content: center;
                z-index: 1000;
            }

            .modal-box {
                background: #1c1c28;
                border: 2px solid #dfb15b;
                border-radius: 8px;
                width: 540px;
                max-height: 80vh;
                display: flex;
                flex-direction: column;
                box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
                overflow: hidden;
            }

            .modal-header {
                padding: 12px 16px;
                background: #14141e;
                border-bottom: 1px solid #333348;
                display: flex;
                align-items: center;
                justify-content: space-between;
                font-weight: 700;
                color: #dfb15b;
            }

            .modal-body {
                padding: 14px;
                overflow-y: auto;
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .window-card {
                background: #252538;
                border: 1px solid #44445c;
                border-radius: 6px;
                overflow: hidden;
                cursor: pointer;
                transition: all 0.2s;
                display: flex;
                flex-direction: column;
            }

            .window-card:hover {
                border-color: #dfb15b;
                transform: translateY(-2px);
                box-shadow: 0 4px 14px rgba(223, 177, 91, 0.3);
            }

            .window-card image {
                width: 100%;
                height: 100px;
                object-fit: cover;
                background: #000;
            }

            .window-card span {
                padding: 8px;
                font-size: 11px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                color: #e0e0e0;
            }

        </style>

    </head>
    <body>
        <!--TOOLBAR-->
        <div class="toolbar">
            <div class="toolbar-title">
                <span>Controller Player Screen</span>
            </div>
            <div class="toolbar-actions">
                <button id="btn-change-bg">Change Background</button>
                <button class="btn-share" id="btn-share">Share Window</button>
                <button class="btn-blackout" id="btn-blackout">Hidding Player Screen</button>
                <button id="btn-reset-view" title="Reset Zoom and Position">Reset View</button>
                <button id="btn-cleaner" class="btn-danger">Clean Screen</button>
            </div>
        </div>

        <div class="stage-area">
            <div class="viewport-box" id="viewport">
                <div class="viewport-default" id="vp-default">
                    <div>Players' Screen connected</div>
                </div>
                <div class="viewport-bg" id="vp-bg"></div>
                <img class="viewport-fg" id="vp-fg" alt="Foreground">
                <video class="viewport-video" id="vp-video" autoplay muted></video>
                <div class="viewport-blackout" id="vp-blackout">Hidden Player Screen</div>
                <div class="drop-hint">Drag and drop any image here</div>
            </div>
        </div>

        <div class="modal-overlay" id="modal-share">
            <div class="modal-box">
                <div class="modal-header">
                    <span>Choose the window to share.</span>
                    <button id="btn-close-modal" style="padding: 2px 8px;">X</button>
                </div>
                <div class="modal-body" id="modal-window-list"></div>
            </div>
        </div>

        <script>
            const electron = require('electron');
            const ipcRenderer = electron.ipcRenderer;
            const webUtils = electron.webUtils;

            const vpDefault = document.getElementById('vp-default');
            const vpBg = document.getElementById('vp-bg');
            const vpFg = document.getElementById('vp-fg');
            const vpVideo = document.getElementById('vp-video');
            const vpBlackout = document.getElementById('vp-blackout');
            const viewport = document.getElementById('viewport');

            const btnChangeBg = document.getElementById('btn-change-bg');
            const btnShare = document.getElementById('btn-share');
            const btnBlackout = document.getElementById('btn-blackout');
            const btnResetView = document.getElementById('btn-reset-view');
            const btnClear = document.getElementById('btn-cleaner');

            const modalShare = document.getElementById('modal-share');
            const modalWindowList = document.getElementById('modal-window-list');
            const btnCloseModal = document.getElementById('btn-close-modal');

            let isSharing = false;
            let isBlackout = false;
            let activeStream = null;

            //zoom variables
            let scale = 1;
            let panX = 0;
            let panY = 0;
            let isPaning = false;
            let startX = 0;
            let startY = 0;

            /*---------------------------------------------MODIFYING WINDOWS-------------------------------------------------------*/
            function updateTransform() {
                vpFg.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
            }

            btnResetView.addEventListener('click', () => {
                scale = 1;
                panX = 0;
                panY = 0;
                updateTransform();
            });

            //zoom with the wheel
            viewport.addEventListener('wheel', (e) => {
                if(vpFg.style.display !== 'none') {
                    e.preventDefault();
                    const zoomFactor = e.deltaY < 0 ? 1.15 : 0.87;
                    scale = Math.min(Math.max(scale * zoomFactor, 0.5), 5);
                    updateTransform();
                }
            }, { passive: false });

            //grabbing the image
            vpFg.addEventListener('mousedown', (e) => {
                if(e.button === 0) {    //right mouse button
                    isPaning = true;
                    startX = e.clientX - panX;
                    startY = e.clientY - panY;
                }
            });

            window.addEventListener('mousemove', (e) => {
                if (isPaning) {
                    panX = e.clientX - startX;
                    panY = e.clientY - startY;
                    updateTransform();
                }
            });

            /*---------------------------------------BUTTON SIGNALS-----------------------------------------*/

            btnChangeBg.addEventListener('click', () => {
                ipcRenderer.send('pick-player-background');
            });

            btnClear.addEventListener('click', () => {
                ipcRenderer.send('clear-player-foreground');
            });

            //button for blackout
            btnBlackout.addEventListener('click', () => {
                isBlackout = !isBlackout;
                btnBlackout.classList.toggle('active', isBlackout);
                btnBlackout.textContent = isBlackout ? 'Active screen' : 'Disactive Screen';
                ipcRenderer.send('toggle-blackout', isBlackout);
            });

            //---------------------------------------DRAG AND DROP---------------------------------------------------------
            window.addEventListener('dragover', e => e.preventDefault(), false);
            window.addEventListener('drop', e => e.preventDefault(), false);

            viewport.addEventListener('dragover', e => {
                e.preventDefault();
                e.stopPropagation();
                e.dataTransfer.dropEffect = 'copy';
                viewport.classList.add('dragover');
            });

            viewport.addEventListener('dragleave', e => {
                e.preventDefault();
                e.stopPropagation();
                viewport.classList.remove('dragover');
            });

            viewport.addEventListener('drop', e => {
                e.preventDefault();
                e.stopPropagation();
                viewport.classList.remove('dragover');
                if(e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                    const file = e.dataTransfer.files[0];
                    const filePath = (webUtils && webUtils.getPathForFile) ? webUtils.getPathForFile(file) : file.path;
                    if (filePath) {
                        ipcRenderer.send('set-player-foreground', filePath);
                    }
                }
            });

            //--------------------------------------SHARING WINDOW-----------------------------------------------------
            btnShare.addEventListener('click', async () => {
                if (isSharing) {
                    ipcRenderer.send('stop-window-share');
                    return;
                }

                const windows = await ipcRenderer.invoke('get-shareable-windows');
                modalWindowList.innerHTML = '';

                windows.forEach(win => {
                    const card  = document.createElement('div');
                    card.className = 'window-card';
                    card.innerHTML = `
                    <img src="${win.thumbnail}">
                    <span title="${win.name}">${win.name}</span>`;
                    card.addEventListener('click', () => {
                        modalShare.style.display = 'none';
                        ipcRenderer.send('start-window-share', win.id);
                    });
                    modalWindowList.appendChild(card);
                });

                modalShare.style.display = 'flex';
            });

            btnCloseModal.addEventListener('click', () => {
                modalShare.style.display = 'none';
            });

            //streaming live
            ipcRenderer.on('start-live-stream', async (event, sourceId) => {
                try {
                    isSharing = true;
                    btnShare.textContent = 'Close Sharing';
                    btnShare.classList.add('active');

                    const stream = await navigator.mediaDevices.getUserMedia({
                        audio: false,
                        video: {
                            mandatory: {
                                chromeMediaSource: 'desktop',
                                chromeMediaSourceId: sourceId
                            }
                        }
                    });

                    activeStream = stream;
                    vpVideo.srcObject = stream;
                    vpVideo.style.display = 'block';
                } catch (err) {
                    console.error('ERROR: preview not found: ', err);
                }
            });

            ipcRenderer.on('stop-live-stream', () => {
                isSharing = false;
                btnShare.textContent = 'Share Window';
                btnShare.classList.remove('active');

                if (activeStream) {
                    activeStream.getTracks().forEach(t => t.stop());
                    activeStream = null;
                }
                vpVideo.style.display = 'none';
                vpVideo.srcObject = null;
            });

            //syncronizing in real time the players' screen
            ipcRenderer.on('sync-preview', (event, { bgPath, fgPath, blackout }) => {
                //background
                if (bgPath) {
                    const formatted = bgPath.replace(/\\/g, '/');
                    vpBg.style.backgroundImage = `url('file:///${formatted}')`;
                    vpBg.style.display = 'block';
                    vpDefault.style.display = 'none';
                } else {
                    vpBg.style.display = 'none';
                    if(!fgPath) vpDefault.style.display = 'flex';
                }

                //foreground image
                if(fgPath) {
                    const formatted = fgPath.replace(/\\/g, '/');
                    vpFg.src = `file:///${formatted}`;
                    vpFg.style.display = 'block';
                    vpDefault.style.display = 'none';
                } else {
                    vpFg.style.display = 'none';
                    if (!bgPath) vpDefault.style.display = 'flex';
                }

                //managing blackout window
                if(blackout !== undefined) {
                    isBlackout = blackout;
                    vpBlackout.style.display = blackout ? 'flex': 'none';
                    btnBlackout.classList.toggle('active', blackout);
                    btnBlackout.textContent = blackout ? 'Active screen' : 'Disactive Screen';
                }
            });

            window.addEventListener('DOMContentLoaded', () => {
                ipcRenderer.send('main-window-ready');
            });

        </script>
    </body>
</html>
