<!DOCTYPE html>

<html lang="eng">
<head>
    <meta charset="UTF-8">
    <title>DM CTRLPanel</title>


    <style>

        body {  /* main panel */
            margin: 0;
            padding: 8px 12px;
            background-color: #1a1a24;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;  /* aligning all elements */
            align-items: center;    /* centring */ 
            gap: 10px;
            user-select: none;
            overflow: hidden;
        }

        button {    /* making a button */
            background: #2b2b3d;
            color: #e0e0e0;
            border: 1px solid #44445a;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {  /* pressed button */
            background: #3e3e57;
            color: #ffffff;
        }

        button:active { /* activating a button */
            transform: scale(0.97);
        }

        .previewbox {   /* previewbox for second screen */
            width: 90px;
            height: 50px;
            background: #0d0d12;
            border: 1px dashed #555570;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #8888aa;
            text-align: center;
        }

        .danger-btn {   /* quitting button */
            background: #5a1e24;
            border-color: #802830;
            margin-left: auto; /* pushing to the right of the panel */
        }

        .danger-btn:hover { /* pressed quitting button */
            background: #7a2830;
        }

    </style>
</head>

<body>

    <button id="btn-word"> Notes </button>
    <button id="btn-manual"> Manual PDF </button>
    <button id="btn-screen2"> Player's Screen </button>

    <div class="previewbox">Player's Screen Preview</div>

    <button id="btn-quit" class="danger-btn"> Save and Quit </button>

    <script>
        
        const { ipcRenderer } = require('electron');

        const btnWord = document.getElementById('btn-word');    /* making the button for the notes */
        const btnQuit = document.getElementById('btn-quit');    /* making the button for save and quit */

        btnWord.addEventListener('click', () => {   /* send a message to main.js asking to open a document */
            ipcRenderer.send('open-notes-dialog');
        });

        btnQuit.addEventListener('click', () => {   /* send a message to main.js asking to close all the windows, saving them */
            ipcRenderer.send('save-and-quit');
        })

    </script>


</body>
</html>
