<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DM CTRLPanel</title>

    <style>
        /* ------------------- MAIN PANEL ------------------- */
        body {
            margin: 0;
            padding: 10px 14px;
            background-color: #1a1a24;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            user-select: none;
            overflow: hidden;
            height: 100vh;
            box-sizing: border-box;
        }

        .top-bar {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        .top-bar button {
            white-space: nowrap;
        }

        button {
            background: #2b2b3d;
            color: #e0e0e0;
            border: 1px solid #44445a;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background: #3e3e57;
            color: #ffffff;
        }

        button:active {
            transform: scale(0.97);
        }
        
        /* ------------------- SECOND SCREEN PREVIEW ------------------- */
        .previewbox {
            width: 90px;
            height: 42px;
            background: #0d0d12;
            border: 1px dashed #555570;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #8888aa;
            text-align: center;
        }

        /* ------------------- SAVE AND QUIT ------------------- */
        .danger-btn {
            background: #5a1e24;
            border-color: #802830;
            margin-left: auto; /* Spinge il pulsante tutto a destra */
        }

        .danger-btn:hover {
            background: #7a2830;
        }
    </style>
</head>

<body>

    <!-- MAIN BUTTONS BAR -->
    <div class="top-bar">
        <button id="btn-word">📝 Notes</button>
        <button id="btn-manuals">📖 Manuals</button>
        <button id="btn-screen2">🖥️ Player's Screen</button>

        <div class="previewbox">P2 Preview</div>

        <button id="btn-quit" class="danger-btn">❌ Save and Quit</button>
    </div>

    <script>
        const { ipcRenderer } = require('electron');

        const btnWord = document.getElementById('btn-word');
        const btnManuals = document.getElementById('btn-manuals');
        const btnQuit = document.getElementById('btn-quit');

        // Opening selector for Word file
        btnWord.addEventListener('click', () => {
            ipcRenderer.send('open-notes-dialog');
        });

        // Opening selector for directory
        btnManuals.addEventListener('click', () => {
            ipcRenderer.send('open-manuals-dialog');
        });

        // Save and quit
        btnQuit.addEventListener('click', () => {
            ipcRenderer.send('save-and-quit');
        });
    </script>
</body>
</html>
