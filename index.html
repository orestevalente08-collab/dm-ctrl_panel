<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DM CTRLPanel</title>

    <style>
        /* ------------------- MAIN PANEL ------------------- */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 10px 14px;
            background-color: #1a1a24;
            flex-direction: column;
            border-radius: 6px;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            gap: 30px;
            user-select: none;
            overflow: hidden;
            height: 100vh;
            box-sizing: border-box;
        }

        .top-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            gap: 12px;
            width: 100%;
        }

        .top-bar button {
            white-space: nowrap;
        }

        button {
            background: #2b2b3d;
            color: #e0e0e0;
            border: 1px solid #44445a;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background: #3e3e57;
            color: #ffffff;
        }

        button:active {
            transform: scale(0.97);
        }

        /* --------------- MUSIC PLAYER ------------------------ */
        .music-dock {
            width: 100%;
            max-width: 600;
            background: #1c1c28;
            border: 1px solid #333348;
            border-radius: 6px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .music-header {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            flex: 1;
        }
        .music-title-box {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            flex: 1;
        }

        .music-title {
            font-size: 13px;
            font-weight: bold;
            color: #ffd97d;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .music-header-actions {
            display: flex;
            gap: 6px;
        }

        /*Timeline*/
        .music-timeline {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            color: #888;
        }

        .progress-bar {
            flex: 1;
            height: 5px;
            background: #2a2a3e;
            border-radius: 3px;
            position: relative;
            cursor: pointer;
        }

        .progress-fill {
            height: 100%;
            background: #dfb15b;
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s linear;
        }

        /* Controls row */
        .music-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex-wrap: wrap;
        }

        .playback-btns {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-play-pause {
            background: #3a2b10;
            border-color: #dfb15b;
            color: #ffd97d;
            font-weight: bold;
            width: 32px;
            height: 28px;
            padding: 0;
        }

        .btn-toggle.active {
            background: #4a3412;
            border-color: #dfb15b;
            color: #ffd97d;
            box-shadow: 0 0 6px rgba(223, 177, 91, 0.4);
        }

        .volume-box {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: #aaa;
        }

        input[type="range"] {
            accent-color: #dfb15b;
            cursor: pointer;
            width: 70px;
        }

        /*Playlist scroll and dropdown*/
        .playlist-wrapper {
            max-height: 110px;
            overflow-y: auto;
            border-top: 1px solid #28283a;
            padding-top: 6px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .song-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #222233;
            border: 1px solid #2d2d42;
            border-radius: 3px;
            padding: 4px 8px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .song-item:hover {
            background: #2b2b40;
            border-color: #44445c;
        }

        .song-item.playing {
            border-color: #dfb15b;
            background: linear-gradient(90deg, #2b2210 0%, #1c1c28 100%);
            color: #ffd97d;
            font-weight: bold;
        }

        .song-name-box {
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            flex: 1;
        }

        .song-reorder-btns {
            display: flex;
            gap: 3px;
        }

        .btn-micro {
            padding: 1px 5px;
            font-size: 9px;
            background: #181824;
            border-color: #333348;
        }
        
        /* ------------------- SECOND SCREEN PREVIEW ------------------- */
        .preview-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .previewbox {
            position: relative;
            width: 600px;
            height: 340px;
            background: #000;
            border: 2px dashed #555570;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #8888aa;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .previewbox:hover {
            border-color: #dfb15b;
        }

        .preview.dragover {
            border-color: #4cd964;
            box-shadow: 0 0 10px rgba(76, 217, 100, 0.5);
        }

        .mini-default {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle to center, #1f1b2c 0%, #0a0812 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            gap: 3px;
            letter-spacing: 1px;
            text-transform: uppercase;
            opacity: 0.8;
            color: #dfb15b;
            opacity: 0.7;
            pointer-events: none;
            z-index: 1;
        }

        .mini-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            filter: brightness(0.75);
            display: none;
            pointer-events: none;
            z-index: 2;
        }

        .mini-fg {
            position: relative;
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border-radius: 2px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.8);
            z-index: 3;
            display: none;
            pointer-events: none;
        }

        /* X button to cancel image */
        .btn-clear-image {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 16px;
            background: rgba(180, 40, 40, 0.85);
            color: #fff;
            border: none;
            border-radius: 50%;
            font-size: 10px;
            line-height: 1;
            padding: 0;
            cursor: pointer;
            display: none;
            z-index: 10;
        }
        .btn-clear-image:hover {
            background: #ff3b30;
        }

        .preview-hint {
            font-size: 10px;
            color: #8888aa;
            margin-top: 2px;
        }

        /* ------------------- SAVE AND QUIT ------------------- */
        .danger-btn {
            background: #5a1e24;
            border-color: #802830;
        }

        .danger-btn:hover {
            background: #7a2830;
        }
    </style>
</head>

<body>

    <!-- MAIN BUTTONS BAR -->
    <div class="top-bar">
        <button id="btn-word">Notes</button>
        <button id="btn-manuals">Manuals</button>
        <button id="btn-initiative" style="border-color: #dfb15b; color: #ffd97d;">Initiative</button>
        <button id="btn-screen2">Player's Screen</button>
        <button id="btn-open-controller">Open Controller</button>
        <button id="btn-quit" class="danger-btn">Save and Quit</button>
    </div>

    <!--MUSIC PLAYER-->
    <div class="music-dock">
        <div class="music-header">
            <div class="music-title-box">
                <div class="music-title" id="music-title">Select a song...</div>
            </div>
            <div class="music-header-actions">
                <button id="btn-toggle-playlist" style="font-size: 11px;">List</button>
                <button id="btn-pick-folder" style="font-size: 11px;">Directory</button>
            </div>
        </div>

        <!--timeline and seek bar-->
        <div class="music-timeline">
            <span id="music-curr">00:00</span>
            <div class="progress-bar" id="music-progress-bar">
                <div class="progress-fill" id="music-progress-fill"></div>
            </div>
            <span id="music-total">00:00</span>
        </div>

        <!--controls row-->
        <div class="music-controls">
            <div class="playback-btns">
                <button id="btn-prev" title="Previous">⏮</button>
                <button class="btn-play-pause" id="btn-play-pause" title="PLay/Pause">▶</button>
                <button id="btn-next" title="Next">⏭</button>

                <!--LOOP BUTTONS-->
                <button class="btn-toggle" id="btn-single-loop" title="Song loop">🔁 Single Loop</button>
                <button class="btn-toggle active" id="btn-loop-all" title="List loop">🔁 Loop All</button>
            </div>

            <div class="volume-box">
                <span>🔊</span>
                <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.7">
            </div>
        </div>

        <!--SONG LIST-->
        <div class="playlist-wrapper" id="playlist-wrapper">
            <div style="text-align: center; color: #666; font-size: 11px; padding: 10px 0;">
                Press Directory to load your songs.
            </div>
        </div>
    </div>
        <!--PREVIEW WITH DRAG AND DROP-->
    <div class="preview-container">
        <div class="previewbox" id="previewbox" title="Drag and drop your image here or open it.">
            <div class="mini-default" id="mini-default">Players</div>
            <div class="mini-bg" id="mini-bg"></div>
            <img class="mini-fg" id="mini-fg" alt="Preview FG">
            <button class="btn-clear-image" id="btn-clear-image" title="Hid the image">x</button>   <!--delete image button-->
        </div>
        <div class="preview-hint">Double click to open the controller</div>
    </div>


    <script>
        const electron = require('electron');
        const ipcRenderer = electron.ipcRenderer;
        const webUtils = electron.webUtils;

        const btnWord = document.getElementById('btn-word');
        const btnManuals = document.getElementById('btn-manuals');
        const btnScreen2 = document.getElementById('btn-screen2');
        const btnInitiative = document.getElementById('btn-initiative');
        const btnOpenController = document.getElementById('btn-open-controller');
        const btnQuit = document.getElementById('btn-quit');

        const previewbox = document.getElementById('previewbox');
        const miniDefault = document.getElementById('mini-default');
        const miniBg = document.getElementById('mini-bg');
        const miniFg = document.getElementById('mini-fg');
        const btnClearImage = document.getElementById('btn-clear-image');

        // Opening selector for Word file
        btnWord.addEventListener('click', () => {
            ipcRenderer.send('open-notes-dialog');
        });

        // Opening selector for directory
        btnManuals.addEventListener('click', () => {
            ipcRenderer.send('open-manuals-dialog');
        });

        // Activating the second screen
        btnScreen2.addEventListener('click', () => {
            ipcRenderer.send('toggle-player-screen')
        });

        //opening initiative
        btnInitiative.addEventListener('click', () => {
            ipcRenderer.send('open-initiative-window');
        });

        // Save and quit
        btnQuit.addEventListener('click', () => {
            ipcRenderer.send('save-and-quit');
        });

        // opening the controller window
        btnOpenController.addEventListener('click', () => {
            ipcRenderer.send('open-player-controller');
        });

        previewbox.addEventListener('dblclick', () => {
            ipcRenderer.send('open-player-controller');
        });

        btnClearImage.addEventListener('click', (e) => {
            e.stopPropagation();
            ipcRenderer.send('clear-player-foreground');
        });

        //-----------------------------DRAG AND DROP PREVIEWBOX------------------------------------------
        window.addEventListener('dragover', (e) => e.preventDefault(), false);
        window.addEventListener('drop', (e) => e.preventDefault(), false);

        previewbox.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.stopPropagation();
            e.dataTransfer.dropEffect = 'copy';
            previewbox.classList.add('dragover');
        });

        previewbox.addEventListener('dragleave', (e) => {
            e.preventDefault();
            e.stopPropagation();
            previewbox.classList.remove('dragover');
        });

        previewbox.addEventListener('drop', (e) => {
            e.preventDefault();
            e.stopPropagation();
            previewbox.classList.remove('dragover');

            if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                const file = e.dataTransfer.files[0];
                //compatibility with all versions of electron
                const filePath = (webUtils && webUtils.getPathForFile) ? webUtils.getPathForFile(file) : file.path;

                if (filePath) ipcRenderer.send('set-player-foreground', filePath);
            }
        });

        //live players' screen

        ipcRenderer.on('sync-preview', (event, { bgPath, fgPath }) => {
            if (bgPath) {
                miniBg.style.backgroundImage = `url('${bgPath.replace(/\\/g, '/')}')`;
                miniBg.style.display = 'block';
                miniDefault.style.display = 'none';
            } else {
                miniBg.style.display = 'none';
                if (!fgPath) miniDefault.style.display = 'flex';
            }
            if (fgPath) {
                miniFg.src = fgPath.replace(/\\/g, '/');
                miniFg.style.display = 'block';
                btnClearImage.style.display = 'block';
                miniDefault.style.display = 'none';
            } else {
                miniFg.style.display = 'none';
                btnClearImage.style.display = 'none';
                if (!bgPath) miniDefault.style.display = 'flex';
            }
        });

//--------------------------------------MUSIC PLAYER--------------------------------------------------------------

        const musicTitle = document.getElementById('music-title');
        const musicCurr = document.getElementById('music-curr');
        const musicTotal = document.getElementById('music-total');
        const musicProgressBar = document.getElementById('music-progress-bar');
        const musicProgressFill = document.getElementById('music-progress-fill');
        const btnPlayPause = document.getElementById('btn-play-pause');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const btnSingleLoop = document.getElementById('btn-single-loop');
        const btnLoopAll = document.getElementById('btn-loop-all');
        const volumeSlider = document.getElementById('volume-slider');
        const btnPickFolder = document.getElementById('btn-pick-folder');
        const btnTogglePlaylist = document.getElementById('btn-toggle-playlist');
        const playlistWrapper = document.getElementById('playlist-wrapper');

        let audio = new Audio();
        let songs = [];
        let currentIndex = -1;
        let isSingleLoop = false;
        let isLoopAll = false;

        function formatTime (sec) {
            if(isNaN(sec)) return '00:00';
            const m = Math.floor(sec/60);
            const s = Math.floor(sec % 60);
            return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0': ''}:${s}`;
        }

        function playSong(idx) {
            if(idx < 0 || idx >= songs.length) return;
            currentIndex = idx;
            const song = songs[currentIndex];

            audio.src = `file:///${song.path.replace(/\\/g, '/')}`;
            audio.volume = parseFloat(volumeSlider.value);
            audio.play();

            musicTitle.textContent = song.name;
            btnPlayPause.textContent = '⏸';
            renderPlaylist();
        }

        function renderPlaylist() {
            playlistWrapper.innerHTML = '';

            if(songs.length === 0) {
                playlistWrapper.innerHTML = `<div style="text-align: center; color: #666; font-size: 11px; padding: 8px 0;>No songs founded.</div>`;
                return;
            }

            songs.forEach((song, idx) => {
                const item = document.createElement('div');
                item.className = `song-item ${idx === currentIndex ? 'playing' : ''}`;
                item.innerHTML = `
                    <div class="song-name-box">
                        <span>${idx === currentIndex ? '▶ ' : (idx + 1) + '. '}</span>
                        <span title="${song.name}">${song.name}</span>
                    </div>
                    <div class="song-reorder-btns">
                        <button class="btn-micro btn-up" title="Move up">▲</button>
                        <button class="btn-micro btn-down" title="Move down">▼</button>
                    </div>`;

                //click on line to play it
                item.addEventListener('click',  (e) => {
                    if (e.target.closest('.song-reorder-btns')) return;
                    playSong(idx);
                });

                //move the song up
                item.querySelector('.btn-up').addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (idx > 0) {
                        const temp = songs[idx];
                        songs[idx] = songs[idx-1];
                        songs[idx-1] = temp;
                        if (currentIndex === idx) currentIndex = idx -1;
                        else if (currentIndex === idx - 1) currentIndex = idx;
                        renderPlaylist();
                    }
                });

                //move the song down
                item.querySelector('.btn-down').addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (idx < songs.length - 1) {
                        const temp = songs[idx];
                        songs[idx] = songs[idx+1];
                        songs[idx+1] = temp;
                        if (currentIndex === idx) currentIndex = idx +1;
                        else if (currentIndex === idx + 1) currentIndex = idx;
                        renderPlaylist();
                    }
                });

                playlistWrapper.appendChild(item);
            });
        }

        //play / pause
        btnPlayPause.addEventListener('click', () => {
            if (songs.length === 0) return;
            if(currentIndex === -1) {
                playSong(0);
                return;
            }

            if(audio.paused) {
                audio.play();
                btnPlayPause.textContent = '⏸';
            } else {
                audio.pause();
                btnPlayPause.textContent = '▶';
            }
        });

        //previous/next
        btnPrev.addEventListener('click', () => {
            if(songs.length === 0) return;
            let prev = currentIndex -1;
            if(prev < 0) prev = songs.length -1;
            playSong(prev);
        });

        btnNext.addEventListener('click', () => {
            if(songs.length === 0) return;
            let next = currentIndex +1;
            if(next >= songs.length) next = 0;
            playSong(next);
        });

        //toggle single loop
        btnSingleLoop.addEventListener('click', () => {
            isSingleLoop = !isSingleLoop;
            btnSingleLoop.classList.toggle('active', isSingleLoop);
            if (isSingleLoop) {
                isLoopAll = false;
                btnLoopAll.classList.remove('active');
            }
        });

        //toggle loop all
        btnLoopAll.addEventListener('click', () => {
            isLoopAll = !isLoopAll;
            btnLoopAll.classList.toggle('active', isLoopAll);
            if (isLoopAll) {
                isSingleLoop = false;
                btnSingleLoop.classList.remove('active');
            }
        });

        //end of the song
        audio.addEventListener('ended', () => {
            if(isSingleLoop) {  //single loop
                audio.currentTime = 0;
                audio.play();
            } else if(isLoopAll) {
                let next = currentIndex + 1;
                if(next >= songs.length) next = 0;
                playSong(next);
            } else {
                if(currentIndex < songs.lenght - 1) {
                    playSong(currentIndex);
                } else {
                    btnPlayPause.textContent = '▶';
                }
            }
        });

        //scrolling time
        audio.addEventListener('timeupdate', () => {
            if(audio.duration) {
                const percent = (audio.currentTime / audio.duration) * 100;
                musicProgressFill.style.width = `${percent}%`;
                musicCurr.textContent = formatTime(audio.currentTime);
                musicTotal.textContent = formatTime(audio.duration);
            }
        });

        //scrubbing timeline
        musicProgressBar.addEventListener('click', (e) => {
            if (!audio.duration) return;
            const rect = musicProgressBar.getBoundingClientRect();
            const pos = (e.clientX - rect.left) / rect.width;
            audio.currentTime = pos * audio.duration;
        });

        //managing volume
        volumeSlider.addEventListener('input', (e) => {
            audio.volume = parseFloat(e.target.value);
        });

        //show/hid list
        btnTogglePlaylist.addEventListener('click', () => {
            if(playlistWrapper.style.display === 'none') {
                playlistWrapper.style.display = 'flex';
                btnTogglePlaylist.textContent = 'Close List';
            } else {
                playlistWrapper.style.display = 'none';
                btnTogglePlaylist.textContent = 'Open List';
            }
        });

        //choose folder
        btnPickFolder.addEventListener('click', () => {
            ipcRenderer.send('pick-music-folder');
        });

        //receving list of songs
        ipcRenderer.on('init-music-list', (event, songList) => {
            songs = songList;
            renderPlaylist();
        });

        //send the signal if the window is ready
        window.addEventListener('DOMContentLoaded', () => {
            ipcRenderer.send('main-window-ready');
            ipcRenderer.send('request-saved-music');    //asking if there's a saved list
        });
    </script>
</body>
</html>
