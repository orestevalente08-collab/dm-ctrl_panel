<!DOCTYPE html>

<html lang="eng">
    <head>
        <meta charset="UTF-8">
        <title>Initiative Tracker</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                user-select: none;
            }

            body {
                width: 100vw;
                height: 100vh;
                background: #14141e;
                color: #e0e0e0;
                font-family: 'Palatino Linotype', Palatino, georgia, serif;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }

            /*--------------------------------HEADER AND ROUND---------------------------------------*/
            .header {
                background: #1c1c28;
                padding: 12px 16px;
                border-bottom: 1px solid #333348;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }

            .header-title {
                font-size: 16px;
                font-weight: 700;
                color: #dfb15b;
                display: flex;
                align-items: center;
                gap: 8px;
            }

            .round-badge {
                font-size: 13px;
                background: #2a2a3e;
                padding: 4px 10px;
                border-radius: 12px;
                border: 1px solid #dfb15b;
                color: #dfb15b;
                font-weight: bold;
            }

            .add-box {
                background: #181824;
                padding: 12px 16px;
                border-bottom: 1px solid #2b2b3d;
                display: flex;
                gap: 8px;
                align-items: center;
            }

            /*--------------------------ADDED FORM-----------------------------*/
            .add-form {
                background: #181824;
                padding: 12px 16px;
                border-bottom: 1px solid #2b2b3d;
                display: grid;
                grid-template-columns: 2fr 1fr 1fr 1fr auto;
                gap: 8px;
                align-items: center;
            }

            input, select {
                background: #262638;
                border: 1px solid #44445c;
                color: #fff;
                padding: 6px 10px;
                border-radius: 4px;
                font-family: inherit;
                font-size: 12px;
                outline: none;
            }

            input:focus, select:focus {
                border-color: #dfb15b;
            }

            button {
                background: #2b2b3d;
                color: #e0e0e0;
                border: 1px solid #44445c;
                padding: 6px 12px;
                border-radius: 4px;
                cursor: pointer;
                font-family: inherit;
                font-size: 12px;
                font-weight: bold;
                transition: all 0.2s;
            }

            button:hover {
                background: #3e3e57;
                border-color: #dfb15b;
                color: #fff;
            }

            .btn-add{
                background: #1f4037;
                border-color: #2e8b57;
                color: #a8f0c0;
            }

            .btn-add:hover {
                background: #285449;
                color: #fff;
            }

            /*----------------------------INITIATIVE LIST----------------------------------*/
            .combat-list {
                flex: 1;
                overflow-y: auto;
                padding: 12px 16px;
                display: flex;
                flex-direction: column;
                gap: 8px;
            }

            .combat-card {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 8px 12px;
                border-radius: 6px;
                background: #1c1c28;
                border: 1px solid #333348;
                transition: all 0.2s;
            }

            .combat-card.active {
                border-color: #dfb15b;
                background: linear-gradient(135deg, #322510 0%, #1e1708 100%);
                box-shadow: 0 0 12px rgba(223, 177, 91, 0.4);
            }

            .combat-card.pc {
                border-left: 4px solid #4cd964;
            }

            .combat-card.monster {
                border-left: 4px solid #ff4d4d;
            }

            .combat-info {
                display: flex;
                align-items: center;
                gap: 12px;
            }

            .init-badge {
                width: 32px;
                height: 32px;
                background: #2a2a3e;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                font-weight: bold;
                color: #dfb15b;
                border: 1px solid #44445c;
                font-size: 13px;
            }

            .combat-name {
                font-weight: bold;
                font-size: 14px;
            }

            .combat-actions {
                display: flex;
                align-items: center;
                gap: 8px;
            }

            .btn-delete {
                background: #5a1e24;
                border-color: #802830;
                color: #ff9999;
                padding: 4px 8px;
            }

            .btn-delete:hover {
                background: #7a2830;
                color: #fff;
            }

            .btn-vis {
                padding: 4px 8px;
                font-size: 12px;
            }

            /*---------------------------------FOOTER TOOLBAR-------------------------------------*/
            .footer {
                background: #1c1c28;
                padding: 10px 16px;
                border-top: 1px solid #333348;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }

            .toggle-label {
                display: flex;
                align-items: center;
                gap: 8px;
                font-size: 12px;
                cursor: pointer;
                color: #dfb15b;
            }

            .btn-next {
                background: #3a2b10;
                border-color: #dfb15b;
                color: #ffd97d;
                padding: 8px 16px;
            }

            .btn-next:hover {
                background: #543e17;
                color: #fff;
            }

        </style>
    </head>

    <body>
        <div class="header">
            <div class="header-title">
                <span>Initiative Tracker</span>
            </div>
            <div class="round-box" id="round-display">Round 1</div>
        </div>

        <!--adding creatures-->
        <div class="add-form">
            <input type="text" id="input-name" placeholder="Name PC or creature...">
            <input type="number" id="input-init" placeholder="Initiative">
            <select id="select-type">
                <option value="pc">Hero (PC)</option>
                <option value="monster">Enemy</option>
            </select>
            <button class="btn-add" id="btn-add">Add +</button>
        </div>

        <!--list-->
        <div class="combat-list" id="combat-list"></div>

        <div class="footer">
            <label class="toggle-label">
                <input type="checkbox" id="check-project">
                <span>Show to Players</span>
            </label>

            <div style="display: flex; gap: 8px;">
                <button id="btn-reset" class="btn-delete" style="font-size: 11px;">Reset</button>
                <button class="btn-next" id="btn-next">Next Turn</button>
            </div>
        </div>

        <script>
            const { ipcRenderer } = require('electron');

            const inputName = document.getElementById('input-name');
            const inputInit = document.getElementById('input-init');
            const selectType = document.getElementById('select-type');
            const btnAdd = document.getElementById('btn-add');

            const combatList = document.getElementById('combat-list');
            const roundDisplay = document.getElementById('round-display');
            const checkProject = document.getElementById('check-project');
            const btnNext = document.getElementById('btn-next');
            const btnReset = document.getElementById('btn-reset');

            let combatants = [];
            let currentRound = 1;
            let activeIndex = 0;

            function saveAndSync() {
                ipcRenderer.send('save-initiative', {
                    list: combatants,
                    round: currentRound,
                    activeIndex: activeIndex,
                    isVisible: checkProject.checked
                });
            }

            function sortCombatants() {
                combatants.sort((a, b) => b.init-a.init);
                if(combatants.length > 0 && !combatants.some(c => c.active)) {
                    combatants[0].active = true;
                    activeIndex = 0;
                }
            }

            function renderList() {
                combatList.innerHTML = '';
                roundDisplay.textContent = `Round ${currentRound}`;

                if(combatants.length === 0) {
                    combatList.innerHTML = `<div style="text-align: center; color: #666; margin-top: 40px;">No fighters</div>`;
                    return;
                }

                combatants.forEach((c, index) => {
                    const card = document.createElement('div');
                    card.className = `combat-card ${c.type} ${c.active ? 'active' : ''}`;
                    card.innerHTML = `
                        <div class="combat-info">
                            <div class="init-badge">${c.init}</div>
                            <div>
                                <div class="combat-name">${c.name}</div>
                                <small style="color: #888;">${c.type === 'pc' ? 'PC' : 'Enemy'}</small>
                            </div>
                        </div>
                        <div class="combat-actions">
                            <button class="btn-delete" data-index="${index}">✕</button>
                        </div>

                        <div class="combat-actions">
                            <button class="btn-vis" title="${c.hidden ? 'Show to players' : 'Hid players'}" data-index="${index}">
                                ${c.hidden ? '🚫' : '👁️'}
                            </button>
                            <button class="btn-delete" title="Rimuovi" data-index="${index}">✕</button>
                        </div>
                    `;

                    combatList.appendChild(card);

                    //button to show to players
                    card.querySelector('.btn-vis').addEventListener('click', () => {
                        combatants[index].hidden = !combatants[index].hidden;
                        renderList();
                        saveAndSync();
                    });

                    //delete fighter
                    card.querySelector('.btn-delete').addEventListener('click', () => {
                        combatants.splice(index, 1);
                        if(activeIndex >= combatants.length) activeIndex = 0;
                        if(combatants.length > 0) combatants[activeIndex].active = true;
                        combatList.appendChild(card);
                    });
                });
            }

            //adding fighter
            btnAdd.addEventListener('click', () => {
                const name = inputName.value.trim();
                let init = parseInt(inputInit.value);
                const type = selectType.value;

                if(!name) return;

                //If there's not initiative, roll a d20 auto
                if(isNaN(init)) {
                    init = Math.floor(Math.random()*20) + 1;
                }

                combatants.push({
                    name,
                    init,
                    type,
                    active: false
                });

                inputName.value = '';
                inputInit.value = '';

                sortCombatants();
                renderList();
                saveAndSync();
            });

            //Enter
            inputName.addEventListener('keypress', (e) => {
                if(e.key === 'Enter') {
                    btnAdd.click();
                }
            });

            inputInit.addEventListener('keypress', (e) => {
                if(e.key === 'Enter') {
                    btnAdd.click();
                }
            });

            //next turn
            btnNext.addEventListener('click', () => {
                if(combatants.length === 0) return;

                combatants[activeIndex].active = false;
                activeIndex = (activeIndex + 1) % combatants.length;
                combatants[activeIndex].active = true;

                if(activeIndex === 0) {
                    currentRound++;
                }

                renderList();
                saveAndSync();
            });

            //toggle players' screen projection
            checkProject.addEventListener('change', () => {
                saveAndSync();
            });

            //reset
            btnReset.addEventListener('click', () => {
                if(confirm("Do you want to reset the combat?")) {
                    combatants = [];
                    currentRound = 1;
                    activeIndex = 0;
                    renderList();
                    saveAndSync();
                }
            });

            //analyzing datas
            window.addEventListener('DOMContentLoaded', async () => {
                const data = await ipcRenderer.invoke('get-initiative');
                if(data && data.list) {
                    combatants = data.list;
                    checkProject.checked = data.isVisible || false;
                    renderList();
                }
            });


        </script>
    </body>
</html>
