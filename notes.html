<!DOCTYPE html>

<html lang = "eng">
    <head>
        <meta charset = "UTF-8">
        <title>DM's Notes</title>
        <style>
            body {  /* main panel */
                margin: 0;
                padding: 5px;
                background: #181820;
                color: #eee;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                display: flex;
                flex-direction: column;
                height: 94vh;
                gap: 12px;
            }

            .controls { /* upper control panel */
                display: flex;
                gap: 15px;
                background: #232330;
                padding: 10px 15px;
                border-radius: 8px;
                align-items: center;
            }

            label {
                font-weight: bold;
                font-size: 14px;
                color: #bbb;
            }

            select {    /* scrolling menu */
                background: #323244;
                color: #fff;
                border: 1px solid #505068;
                padding: 8px 12px;
                border-radius: 6px;
                font-size: 14px;
                cursor: pointer;
                outline: none;
            }

            #season-select { /* season's menu */
                width: 80px;
                text-overflow: ellipsis;
                white-space: nowrap;
                overflow: hidden;
            }

            #session-select { /* session's menu */
                width: 60px;
            }

            .btn-word { /* button to open Word */
                margin-left: auto;
                background: #1e3a8a;
                color: #fff;
                border: 1px solid #3b82f6;
                padding: 7px 14px;
                border-radius: 6px;
                cursor: pointer;
                font-weight: 600;
                font-size: 13px;
                transition: background 0.2s;
            }

            .btn-word:hover {
                background: #2563eb;
            }

            .notes-display {    /* display with notes */
                flex: 1;
                background: #20202c;
                border: 1px solid #323244;
                border-radius: 8px;
                padding: 20px 25px;
                overflow-y: auto;   /* adding scroll if text is long */
                line-height: 1.6;
            }

            .note-card {    /* notes block's style */
                background: #292938;
                margin-bottom: 12px;
                padding: 12px 16px;
                border-left: 4px solid #6366f1;
                border-radius: 6px;
            }

            .note-card ul, .note-card ol {  /* keeping original style */
                margin: 8px 0;
                padding-left: 24px;
            }

            .note-card li {
                margin-bottom: 6px;
            }

            .note-card strong { /* pointing out bold strings */
                color: #60a5fa;
            }
        </style>
    </head>
    <body>

        <div class="controls">
            <label for="season-select">Season:</label>
            <select id="season-select"></select>

            <label for="session-select">Session:</label>
            <select id="session-select"></select>

            <button id="btn-open-word" class="btn-word">Modify with Word</button>
        </div>

        <div class="notes-display" id="notes-display">
            <p style="color: #777;">Loading notes...</p>
        </div>

        <script>
            const { ipcRenderer } = require('electron');

            let campaign = {};
            const seasonSelect = document.getElementById('season-select');
            const sessionSelect = document.getElementById('session-select');
            const notesDisplay = document.getElementById('notes-display');
            const btnOpenWord = document.getElementById('btn-open-word');

            let seasonToRestore = null; //variable to restore season
            let sessionToRestore = null;    //variable to restore session

            btnOpenWord.addEventListener('click', () => {   //clicking the button, it send the signal to open Word
                ipcRenderer.send('open-in-word');
            });

            window.addEventListener('DOMContentLoaded', () => { //when the window is ready, load the ntoes
                ipcRenderer.send('notes-window-ready');
            });

            ipcRenderer.on('init-notes-html', (event, payload) => { //loading the notes converted by mammoth
                let rawHtml = payload;
                if (typeof payload === 'object' && payload.html) {
                    rawHtml = payload.html;
                    seasonToRestore = payload.savedSeason;
                    sessionToRestore = payload.savedSession;
                }

                parseHtmltoCampaign(rawHtml);
                populateSeason();
            });

            function parseHtmltoCampaign(rawHtml) {
                campaign = {};
                let currentSeason = null;
                let currentSession = null;

                const tempDiv = document.createElement('div');  /* temporary box for html */
                tempDiv.innerHTML = rawHtml;

                const elements = Array.from(tempDiv.children);

                elements.forEach(el => {
                    const text = el.textContent.trim();
                    if (!text) return;  // jumping void elements

                    if (/^stagione/i.test(text)) {  //controling seasons
                        currentSeason = text;
                        campaign[currentSeason] = {};
                        currentSession = null;
                    }

                    else if (/^sessione/i.test(text)) { //controling sessions
                        currentSession = text.replace(/:$/, '').trim();
                        if (!currentSeason) {
                            currentSeason = "Initial Notes";
                            campaign[currentSeason] = {};
                        }
                        if (!campaign[currentSeason][currentSession]) {
                            campaign[currentSeason][currentSession] = [];
                        }
                    }

                    else {  //all other strings
                        if (!currentSeason) {
                            currentSeason = "Initial Notes";
                            campaign[currentSeason] = {};
                        }
                        if (!currentSession) {
                            currentSession = "General";
                            campaign[currentSeason][currentSession] = [];
                        }
                        
                        campaign[currentSeason][currentSession].push(el.outerHTML); //saving the original style
                    }

                });
            }

            function populateSeason() {
                const currentSelectedSeason = seasonSelect.value;
                seasonSelect.innerHTML = '';
                const seasons = Object.keys(campaign);

                seasons.forEach(season => {
                    const option = document.createElement('option');
                    option.value = season;
                    option.textContent = season;
                    seasonSelect.appendChild(option);
                });

                if(seasons.length > 0) {
                    let seasonToSelect = seasons[0];
                    if (seasonToRestore && seasons.includes(seasonToRestore)) {
                        seasonToSelect = seasonToRestore;
                    } else if (seasons.includes(currentSelectedSeason)) {
                        seasonToSelect = currentSelectedSeason;
                    } else {
                        const s1 =  seasons.find(s => s.toLowerCase().includes('stagione 1'));
                        if ('s1') seasonToSelect = 1;
                    }
                    seasonSelect.value = seasonToSelect;
                    updateSessions(seasonToSelect);
                }
            }

            function updateSessions(season) {
                const currentSelectedSession = sessionSelect.value;
                sessionSelect.innerHTML = '';
                const sessions = Object.keys(campaign[season] || {});

                sessions.forEach(session => {
                    const option = document.createElement('option');
                    option.value = session;
                    option.textContent = session;
                    sessionSelect.appendChild(option);
                });

                if (sessions.length > 0) {
                    let sessionToSelect = sessions[0];
                    if (sessionToRestore && sessions.includes(sessionToRestore)) {
                        sessionToSelect = sessionToRestore;
                        sessionToRestore = null;
                        seasonToRestore = null;
                    } else if (sessions.includes(currentSelectedSession)) {
                        sessionToSelect = currentSelectedSession;
                    }
                    sessionSelect.value = sessionToSelect;
                    displayNotes(season, sessionToSelect);
                    notifySelection();
                } else {
                    notesDisplay.innerHTML = '<p style="color #777"> not found.</p>'
                }
            }
            
            function displayNotes(season, session) {
                notesDisplay.innerHTML = '';
                const points = (campaign[season] && campaign[season][session]) || [];

                if (points.length === 0) {
                    notesDisplay.innerHTML = '<p style="color: #777;">Notes not found.</p>';
                    return;
                }

                points.forEach(point => {
                    const div = document.createElement('div');
                    div.className = 'note-card';

                    if (/^gruppo [a-z]:/i.test(point)) {
                        div.style.borderLeftColor = '#f59e0b';
                    }

                    div.innerHTML = point;
                    notesDisplay.appendChild(div);
                });
            }

            function notifySelection() {
                ipcRenderer.send('save-notes-selection', {
                    season: seasonSelect.value,
                    session: sessionSelect.value
                });
            }

            seasonSelect.addEventListener('change', (e) => {
                updateSessions(e.target.value);
                notifySelection();
            });

            sessionSelect.addEventListener('change', (e) => {
                displayNotes(seasonSelect.value, e.target.value);
                notifySelection();
            });
        </script>
    </body>
</html>
